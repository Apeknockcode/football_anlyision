[project]
name = "football_anlyision"
version = "0.1.0"
description = "Football analysis AI tool: match review reports for fans (public data + LLM)."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "SQLAlchemy>=2.0.0",
    "requests>=2.28.0",
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
    "jinja2>=3.1.0",
    "python-dotenv>=1.0.0",
    "pydantic>=2.0.0",
    "paddlepaddle>=2.5.0",
    "paddleocr>=2.6.0",
    "playwright>=1.40.0",
]

[project.optional-dependencies]
llm-openai = ["openai>=1.0.0"]
llm-httpx = ["httpx>=0.25.0"]

[tool.setuptools.packages.find]
where = ["."]
include = ["etl*", "engine*", "report*", "api*", "data*"]
